<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header style="margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333;">
    <h1>Admin Dashboard</h1>
    <nav>
      <a href="jobs.html" style="color: #3b82f6; text-decoration: none; margin-right: 15px;">&larr; Back to Job Board</a>
    </nav>
  </header>

  <main>
    <h2>Active User Directory</h2>
    
    <div style="margin-bottom: 20px;">
      <input type="text" id="search_user" placeholder="Search by name or phone..." style="width: 100%; max-width: 400px; padding: 10px; border-radius: 4px; border: 1px solid #333; background: #1e1e1e; color: #fff;" onkeyup="loadActiveUsers()">
    </div>

    <div id="active-users-list" style="display: flex; flex-direction: column; gap: 15px;">
      <p>Loading users...</p>
    </div>

    <!-- PENDING GRIEVANCES SECTION -->
    <div class="panel" style="margin-top: 40px; background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #333;">
      <h2 style="color: #ef4444; margin-top: 0;">Pending Grievances</h2>
      <div id="grievance-list" style="display: flex; flex-direction: column; gap: 15px;">
        <p style="color: #a1a1aa;">Loading grievances...</p>
      </div>
    </div>
  </main>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Run security check on page load
    document.addEventListener('DOMContentLoaded', checkAdminAccess);

    // --- SECURITY CHECK ---
    async function checkAdminAccess() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      // 1. Kick out if not logged in at all
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      // 2. Fetch user's role from the database
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      // 3. Kick out if they are not explicitly an admin
      if (error || !profile || profile.role !== 'admin') {
        alert("Access Denied: You do not have administrator privileges.");
        window.location.href = 'jobs.html'; // Redirect them back to the job board
        return;
      }

      // 4. If they pass the check, load admin data!
      loadActiveUsers();
      loadGrievances();
    }

    // --- USER DIRECTORY, STRIKES & BADGES ---
    async function loadActiveUsers() {
      const searchTerm = document.getElementById('search_user').value.toLowerCase();
      
      const { data: users, error } = await supabaseClient.from('profiles').select('*').eq('status', 'active');
      const container = document.getElementById('active-users-list');
      
      if (error) { container.innerHTML = `<p style="color:#ef4444">Error: ${error.message}</p>`; return; }
      
      const filteredUsers = users.filter(u => 
        (u.full_name && u.full_name.toLowerCase().includes(searchTerm)) || 
        (u.phone && u.phone.includes(searchTerm))
      );

      if (!filteredUsers.length) { container.innerHTML = '<p>No active users found matching your search.</p>'; return; }

      container.innerHTML = filteredUsers.map(u => {
        const userBadges = u.badges || [];
        const badgeDisplay = userBadges.map(b => `<span class="badge badge-community">${b}</span>`).join('');
        
        return `
          <div class="user-card" style="background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333;">
            <h3 style="margin-top:0;">
              ${u.full_name} 
              <span style="color: #ef4444; font-size: 14px;">(Strikes: ${u.strikes || 0})</span>
            </h3>
            <div class="badge-container" style="margin-left: 0; margin-bottom: 10px;">${badgeDisplay}</div>
            <p><strong>Phone:</strong> ${u.phone} | <strong>Zip:</strong> ${u.zip_code}</p>
            
            <div style="margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
              <select id="badge-select-${u.id}" style="width: auto; margin-right: 5px; padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;">
                <option value="🚜 Verified Farmer">🚜 Verified Farmer</option>
                <option value="🛠️ Trusted Hand">🛠️ Trusted Hand</option>
                <option value="🤝 Community Vetted">🤝 Community Vetted</option>
              </select>
              <button onclick="awardBadge('${u.id}', '${encodeURIComponent(JSON.stringify(userBadges))}')" style="background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 8px 12px; margin-right: 10px;">Give Badge</button>
              
              <button onclick="addStrike('${u.id}', ${u.strikes || 0})" style="background: #f59e0b; color: #121212; border: none; border-radius: 4px; cursor: pointer; padding: 8px 12px; margin-right: 10px;">+1 Strike</button>
              <button onclick="updateStatus('${u.id}', 'banned')" style="background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 8px 12px;">Ban User</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // --- AWARD BADGE ---
    async function awardBadge(userId, currentBadgesStr) {
      const currentBadges = JSON.parse(decodeURIComponent(currentBadgesStr));
      const newBadge = document.getElementById(`badge-select-${userId}`).value;
      
      if (currentBadges.includes(newBadge)) {
        alert("User already has this badge!");
        return;
      }
      
      const updatedBadges = [...currentBadges, newBadge];
      
      const { error } = await supabaseClient.from('profiles').update({ badges: updatedBadges }).eq('id', userId);
      if (error) {
        alert("Error saving badge: " + error.message);
      } else {
        loadActiveUsers(); 
      }
    }

    // --- USER MANAGEMENT ---
    async function addStrike(userId, currentStrikes) {
      if (!confirm("Are you sure you want to add a strike to this user?")) return;
      const { error } = await supabaseClient.from('profiles').update({ strikes: currentStrikes + 1 }).eq('id', userId);
      if (error) alert("Error adding strike: " + error.message);
      else loadActiveUsers();
    }

    async function updateStatus(userId, newStatus) {
      if (!confirm(`Are you sure you want to change this user's status to ${newStatus}?`)) return;
      const { error } = await supabaseClient.from('profiles').update({ status: newStatus }).eq('id', userId);
      if (error) alert("Error updating status: " + error.message);
      else loadActiveUsers();
    }

    // --- ENHANCED GRIEVANCE MANAGEMENT ---
    async function loadGrievances() {
      const container = document.getElementById('grievance-list');
      const { data: grievances, error } = await supabaseClient
        .from('grievances')
        .select('*, profiles:reporter_id(full_name, phone)')
        .eq('status', 'pending')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p style="color:#ef4444">Error loading grievances: ${error.message}</p>`;
        return;
      }

      if (!grievances || grievances.length === 0) {
        container.innerHTML = '<p style="color:#10b981;">No active grievances pending review.</p>';
        return;
      }

      container.innerHTML = grievances.map(g => `
        <div style="background: #2a2a2a; padding: 15px; border-radius: 6px; border-left: 4px solid #ef4444;">
          <h4 style="margin: 0 0 5px 0; color: #fff;">${g.reason}</h4>
          <p style="font-size: 13px; color: #a1a1aa; margin: 0 0 10px 0;">
            Filed by: <strong>${g.profiles?.full_name || 'Unknown'}</strong> (${g.profiles?.phone || 'N/A'}) on ${new Date(g.created_at).toLocaleDateString()}
          </p>
          <p style="color: #ddd; white-space: pre-wrap; font-size: 14px; background: #1e1e1e; padding: 10px; border-radius: 4px;">${g.details}</p>
          
          <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; border-top: 1px solid #333; padding-top: 10px;">
            <button onclick="resolveGrievance('${g.id}', 'resolved')" style="background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">Mark Resolved</button>
            <button onclick="actionAndResolveGrievance('${g.id}', 'strike')" style="background: #f59e0b; color: #121212; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px;">+1 Strike Offender & Resolve</button>
            <button onclick="actionAndResolveGrievance('${g.id}', 'ban')" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">Ban Offender & Resolve</button>
            <button onclick="resolveGrievance('${g.id}', 'dismissed')" style="background: #6b7280; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;">Dismiss</button>
          </div>
        </div>
      `).join('');
    }

    async function resolveGrievance(id, status) {
      const { error } = await supabaseClient.from('grievances').update({ status }).eq('id', id);
      if (error) alert('Error updating status: ' + error.message);
      else loadGrievances();
    }

    // Quick Action: Prompt for reported user's phone or name, apply penalty, and archive grievance
    async function actionAndResolveGrievance(grievanceId, actionType) {
      const searchTerm = prompt(`Enter the reported user's EXACT phone number or name to apply this ${actionType}:`);
      if (!searchTerm) return;

      // Find user profile
      const { data: users, error: searchError } = await supabaseClient
        .from('profiles')
        .select('id, full_name, strikes')
        .or(`phone.eq.${searchTerm},full_name.ilike.%${searchTerm}%`);

      if (searchError || !users || users.length === 0) {
        alert("Could not locate a user matching that phone number or name. Action canceled.");
        return;
      }

      const targetUser = users[0];

      if (actionType === 'strike') {
        const newStrikes = (targetUser.strikes || 0) + 1;
        await supabaseClient.from('profiles').update({ strikes: newStrikes }).eq('id', targetUser.id);
        alert(`Added 1 strike to ${targetUser.full_name}. Total strikes: ${newStrikes}`);
      } else if (actionType === 'ban') {
        await supabaseClient.from('profiles').update({ status: 'banned' }).eq('id', targetUser.id);
        alert(`${targetUser.full_name} has been banned.`);
      }

      // Automatically resolve grievance after taking action
      await resolveGrievance(grievanceId, 'resolved');
      loadActiveUsers(); // Refresh user list above
    }
  </script>
</body>
</html>
