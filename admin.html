<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Ultra-Wide Layout without Scrollbars */
    .admin-container {
      width: 98%;
      max-width: 1800px;
      margin: 0 auto;
      padding: 20px 0;
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 1px solid #333;
      gap: 15px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Mobile Responsive Header Layout */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 12px;
      }
    }

    .admin-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: #1e1e1e;
      border-radius: 8px;
      border: 1px solid #333;
    }

    .admin-table th {
      background: #2a2a2a;
      color: #a1a1aa;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #333;
      white-space: nowrap;
    }

    .admin-table td {
      padding: 10px 12px;
      color: #e4e4e7;
      font-size: 13px;
      border-bottom: 1px solid #2a2a2a;
      vertical-align: middle;
      white-space: nowrap;
    }

    .admin-table td.details-cell {
      white-space: normal;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .admin-table tr:hover {
      background: #252525;
    }

    /* Tight Controls Layout */
    .action-group {
      display: flex;
      align-items: center;
      gap: 6px;
      justify-content: flex-start;
    }

    .badge-select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .status-active, .status-resolved { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
    .status-banned, .status-dismissed { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

    .btn-sm {
      padding: 5px 9px;
      font-size: 11px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity 0.15s ease;
    }

    .btn-sm:hover { opacity: 0.85; }
    .btn-approve { background: #10b981; color: white; }
    .btn-strike { background: #f59e0b; color: #111; }
    .btn-ban { background: #ef4444; color: white; }
    .btn-add { background: #3b82f6; color: white; }
    .btn-dismiss { background: #52525b; color: white; }

    select.select-sm {
      padding: 4px 6px;
      font-size: 12px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
      width: 150px;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <header class="header-container">
      <div>
        <h1 style="margin: 0; font-size: 24px;">Admin Command Center</h1>
        <p style="margin: 4px 0 0 0; color: #a1a1aa; font-size: 13px;">Member Management &amp; Moderation</p>
      </div>
      <nav class="nav-links">
        <a href="jobs.html" style="color: #3b82f6; text-decoration: none; font-size: 13px;">&larr; Back to Job Board</a>
        <button onclick="logout()" class="btn-sm" style="background: #333; color: #aaa;">Log Out</button>
      </nav>
    </header>

    <!-- SECTION 1: MEMBER REGISTRY -->
    <div style="margin-bottom: 35px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <h3 style="margin: 0; color: #fff;">Member Registry</h3>
        <input type="text" id="user-search" placeholder="Filter by name, zip, or referral..." onkeyup="filterUsers()" style="padding: 6px 10px; background: #1e1e1e; border: 1px solid #333; color: #fff; border-radius: 4px; width: 240px; font-size: 12px;">
      </div>

      <table class="admin-table">
        <thead>
          <tr>
            <th style="width: 22%;">Member</th>
            <th style="width: 16%;">Contact &amp; Travel</th>
            <th style="width: 8%;">Status</th>
            <th style="width: 8%;">Strikes</th>
            <th style="width: 22%;">Award Badge</th>
            <th style="width: 24%;">Moderation Actions</th>
          </tr>
        </thead>
        <tbody id="user-table-body">
          <tr>
            <td colspan="6" style="text-align: center; color: #a1a1aa; padding: 25px;">Loading member records...</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- SECTION 2: GRIEVANCE REPORTS -->
    <div style="margin-bottom: 35px;">
      <h3 style="margin: 0 0 12px 0; color: #fff;">Grievance Reports</h3>
      <table class="admin-table">
        <thead>
          <tr>
            <th style="width: 15%;">Reporter</th>
            <th style="width: 15%;">Reported Member</th>
            <th style="width: 50%;">Reason &amp; Details</th>
            <th style="width: 8%;">Status</th>
            <th style="width: 12%;">Actions</th>
          </tr>
        </thead>
        <tbody id="grievance-table-body">
          <tr>
            <td colspan="5" style="text-align: center; color: #a1a1aa; padding: 25px;">Loading grievance reports...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allUsers = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (error || !profile || profile.role !== 'admin') {
        alert('Unauthorized access. Admin privileges required.');
        window.location.href = 'jobs.html';
        return;
      }

      await fetchUsers();
      await fetchGrievances();
    });

    async function fetchUsers() {
      const { data: users, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        alert('Error fetching users: ' + error.message);
        return;
      }

      allUsers = users || [];
      renderUserTable(allUsers);
    }

    function renderUserTable(users) {
      const tbody = document.getElementById('user-table-body');
      
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #a1a1aa; padding: 20px;">No members found.</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => {
        const badges = u.badges || [];
        const badgeListHtml = badges.length 
          ? `<div style="margin-top:4px; display:flex; flex-wrap:wrap; gap:3px;">${badges.map(b => `<span class="badge badge-community" style="font-size:9px; padding:2px 5px;">${b}</span>`).join('')}</div>`
          : '';

        let statusClass = 'status-pending';
        if (u.status === 'active') statusClass = 'status-active';
        if (u.status === 'banned') statusClass = 'status-banned';

        // REFERRAL LOOKUP LOGIC
        let referralHtml = '';

        // 1. Who referred this user?
        if (u.referrer_email) {
          const referrerUser = allUsers.find(r => r.email && r.email.toLowerCase() === u.referrer_email.toLowerCase());
          if (referrerUser) {
            referralHtml += `
              <div style="font-size: 11px; color: #10b981; margin-top: 3px;">
                🎁 Referred by: <strong>${referrerUser.full_name}</strong> (${u.referrer_email}${referrerUser.phone ? ' | 📞 ' + referrerUser.phone : ''})
              </div>`;
          } else {
            referralHtml += `
              <div style="font-size: 11px; color: #a1a1aa; margin-top: 3px;">
                🎁 Referred by: ${u.referrer_email} <span style="color:#eab308; opacity:0.8;">(Unmatched)</span>
              </div>`;
          }
        }

        // 2. Which members were referred BY this user?
        if (u.email) {
          const referredMembers = allUsers.filter(r => r.referrer_email && r.referrer_email.toLowerCase() === u.email.toLowerCase());
          
          if (referredMembers.length > 0) {
            if (referredMembers.length <= 3) {
              // Inline list for 1 to 3 referrals
              const memberNames = referredMembers.map(m => `<strong>${m.full_name || 'Unnamed'}</strong>`).join(', ');
              referralHtml += `
                <div style="font-size: 11px; color: #3b82f6; margin-top: 3px;">
                  👥 Referred (${referredMembers.length}): ${memberNames}
                </div>`;
            } else {
              // Pop-up modal button for 4 or more referrals
              referralHtml += `
                <div style="font-size: 11px; margin-top: 4px;">
                  <button onclick="showReferralsModal('${u.id}')" style="background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; border-radius: 4px; padding: 2px 7px; font-size: 10px; cursor: pointer; font-weight: bold;">
                    👥 View ${referredMembers.length} Referrals
                  </button>
                </div>`;
            }
          }
        }

        return `
          <tr>
            <td>
              <strong style="color: #fff; font-size: 14px;">${u.full_name || 'Unnamed User'}</strong>
              <div style="font-size: 11px; color: #a1a1aa; margin-top: 2px;">Role: ${u.role || 'member'}</div>
              ${referralHtml}
              ${badgeListHtml}
            </td>
            <td>
              <div>📞 ${u.phone || 'N/A'}</div>
              <div style="font-size: 11px; color: #a1a1aa; margin-top: 2px;">📍 Zip ${u.zip_code || 'N/A'} (${u.max_distance || 25} mi)</div>
            </td>
            <td>
              <span class="status-pill ${statusClass}">${u.status || 'pending'}</span>
            </td>
            <td>
              <strong style="color: ${u.strikes > 0 ? '#ef4444' : '#10b981'};">${u.strikes || 0}</strong> / 3
            </td>
            <td>
              <div class="badge-select-group">
                <select id="badge-select-${u.id}" class="select-sm">
                  <option value="🚜 Verified Farm">🚜 Verified Farm</option>
                  <option value="🤝 Trusted Hand">🤝 Trusted Hand</option>
                  <option value="🌟 Community Pillar">🌟 Community Pillar</option>
                  <option value="🔧 Equipment Operator">🔧 Equipment Operator</option>
                </select>
                <button onclick="awardBadge('${u.id}')" class="btn-sm btn-add">+ Add</button>
              </div>
            </td>
            <td>
              <div class="action-group">
                ${u.status !== 'active' ? `<button onclick="setStatus('${u.id}', 'active')" class="btn-sm btn-approve">Approve</button>` : ''}
                <button onclick="addStrike('${u.id}', ${u.strikes || 0})" class="btn-sm btn-strike">+1 Strike</button>
                ${u.status !== 'banned' ? `<button onclick="setStatus('${u.id}', 'banned')" class="btn-sm btn-ban">Ban</button>` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // MODAL POP-UP FOR HIGH VOLUME REFERRALS
    function showReferralsModal(userId) {
      const existing = document.getElementById('ref-modal');
      if (existing) existing.remove();

      const user = allUsers.find(u => u.id === userId);
      if (!user) return;

      const referred = allUsers.filter(r => r.referrer_email && r.referrer_email.toLowerCase() === user.email.toLowerCase());

      const listHtml = referred.map(m => `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #333;">
          <div>
            <strong style="color: #fff; display: block; font-size: 13px;">${m.full_name || 'Unnamed'}</strong>
            <span style="color: #a1a1aa; font-size: 12px;">📞 ${m.phone || 'No phone'}</span>
          </div>
          <span class="status-pill status-${m.status || 'pending'}">${m.status || 'pending'}</span>
        </div>
      `).join('');

      const modalHtml = `
        <div id="ref-modal" style="position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); display: flex; align-items: center; justify-content: center; z-index: 9999;">
          <div style="background: #1e1e1e; border: 1px solid #444; border-radius: 8px; width: 420px; max-height: 80vh; padding: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #333;">
              <h3 style="margin: 0; color: #fff; font-size: 16px;">Referrals by ${user.full_name || 'Member'} (${referred.length})</h3>
              <button onclick="document.getElementById('ref-modal').remove()" style="background: none; border: none; color: #aaa; font-size: 20px; cursor: pointer;">&times;</button>
            </div>
            <div style="overflow-y: auto; max-height: 380px; padding-right: 5px;">
              ${listHtml}
            </div>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML('beforeend', modalHtml);
    }

    async function fetchGrievances() {
      const { data: grievances, error } = await supabaseClient
        .from('grievances')
        .select('*')
        .order('created_at', { ascending: false });

      const tbody = document.getElementById('grievance-table-body');

      if (error) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #ef4444; padding: 20px;">Error loading grievances.</td></tr>';
        return;
      }

      if (!grievances || !grievances.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #a1a1aa; padding: 20px;">No grievances reported.</td></tr>';
        return;
      }

      tbody.innerHTML = grievances.map(g => {
        const reporter = allUsers.find(u => u.id === g.reporter_id);
        const reported = allUsers.find(u => u.id === g.reported_user_id);

        // Extract fallback name from details string if reported_user_id is null/unmatched
        let reportedName = 'N/A / Deleted User';
        if (reported) {
          reportedName = reported.full_name;
        } else if (g.details && g.details.includes('[Reported Member Info:')) {
          const match = g.details.match(/\[Reported Member Info:\s*([^\]]+)\]/);
          if (match && match[1]) {
            reportedName = match[1].trim();
          }
        }

        let statusClass = 'status-pending';
        if (g.status === 'resolved') statusClass = 'status-resolved';
        if (g.status === 'dismissed') statusClass = 'status-dismissed';

        return `
          <tr>
            <td>
              <strong style="color: #fff;">${reporter ? reporter.full_name : 'Unknown Member'}</strong>
            </td>
            <td>
              <strong style="color: #ef4444;">${reportedName}</strong>
            </td>
            <td class="details-cell">
              <div style="font-weight: bold; color: #f59e0b; margin-bottom: 3px;">Reason: ${g.reason}</div>
              <div style="color: #ccc; font-size: 12px; line-height: 1.3;">${g.details}</div>
            </td>
            <td>
              <span class="status-pill ${statusClass}">${g.status || 'pending'}</span>
            </td>
            <td>
              <div class="action-group">
                ${g.status === 'pending' ? `
                  <button onclick="updateGrievanceStatus('${g.id}', 'resolved')" class="btn-sm btn-approve">Resolve</button>
                  <button onclick="updateGrievanceStatus('${g.id}', 'dismissed')" class="btn-sm btn-dismiss">Dismiss</button>
                ` : `<span style="font-size: 12px; color: #a1a1aa;">Completed</span>`}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    async function updateGrievanceStatus(id, status) {
      const { error } = await supabaseClient
        .from('grievances')
        .update({ status })
        .eq('id', id);

      if (error) alert('Error updating grievance: ' + error.message);
      else fetchGrievances();
    }

    function filterUsers() {
      const query = document.getElementById('user-search').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.full_name && u.full_name.toLowerCase().includes(query)) ||
        (u.zip_code && u.zip_code.toLowerCase().includes(query)) ||
        (u.referrer_email && u.referrer_email.toLowerCase().includes(query))
      );
      renderUserTable(filtered);
    }

    async function setStatus(userId, status) {
      const { error } = await supabaseClient
        .from('profiles')
        .update({ status })
        .eq('id', userId);

      if (error) alert('Error updating status: ' + error.message);
      else fetchUsers();
    }

    async function addStrike(userId, currentStrikes) {
      const newStrikes = currentStrikes + 1;
      const updates = { strikes: newStrikes };
      
      if (newStrikes >= 3) {
        updates.status = 'banned';
        alert('Member reached 3 strikes and has been automatically banned.');
      }

      const { error } = await supabaseClient
        .from('profiles')
        .update(updates)
        .eq('id', userId);

      if (error) alert('Error issuing strike: ' + error.message);
      else fetchUsers();
    }

    async function awardBadge(userId) {
      const selectedBadge = document.getElementById(`badge-select-${userId}`).value;
      const user = allUsers.find(u => u.id === userId);
      const currentBadges = user.badges || [];

      if (currentBadges.includes(selectedBadge)) {
        alert('Member already has this badge.');
        return;
      }

      const updatedBadges = [...currentBadges, selectedBadge];

      const { error } = await supabaseClient
        .from('profiles')
        .update({ badges: updatedBadges })
        .eq('id', userId);

      if (error) alert('Error awarding badge: ' + error.message);
      else fetchUsers();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
