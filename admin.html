<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Clean Table & Grid Alignment Styles */
    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: #1e1e1e;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .admin-table th {
      background: #2a2a2a;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid #333;
    }

    .admin-table td {
      padding: 14px 16px;
      color: #e4e4e7;
      font-size: 14px;
      border-bottom: 1px solid #2a2a2a;
      vertical-align: middle;
    }

    .admin-table tr:last-child td {
      border-bottom: none;
    }

    .admin-table tr:hover {
      background: #252525;
    }

    /* Alignment Containers for Controls */
    .action-group {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
      flex-wrap: nowrap;
    }

    .badge-select-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .status-active { background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; }
    .status-pending { background: rgba(245, 158, 11, 0.2); color: #f59e0b; border: 1px solid #f59e0b; }
    .status-banned { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity 0.15s ease;
    }

    .btn-sm:hover { opacity: 0.85; }
    .btn-approve { background: #10b981; color: white; }
    .btn-strike { background: #f59e0b; color: #111; }
    .btn-ban { background: #ef4444; color: white; }
    .btn-add { background: #3b82f6; color: white; }
    
    select.select-sm {
      padding: 5px 8px;
      font-size: 12px;
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <div class="admin-container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #333;">
      <div>
        <h1 style="margin: 0;">Admin Command Center</h1>
        <p style="margin: 5px 0 0 0; color: #a1a1aa; font-size: 14px;">Member Management &amp; Moderation</p>
      </div>
      <nav style="display: flex; align-items: center; gap: 15px;">
        <a href="jobs.html" style="color: #3b82f6; text-decoration: none; font-size: 14px;">&larr; Back to Job Board</a>
        <button onclick="logout()" class="btn-sm" style="background: #333; color: #aaa;">Log Out</button>
      </nav>
    </header>

    <!-- USER MANAGEMENT PANEL -->
    <div style="margin-bottom: 30px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0; color: #fff;">Member Registry</h3>
        <input type="text" id="user-search" placeholder="Filter by name or zip..." onkeyup="filterUsers()" style="padding: 8px 12px; background: #1e1e1e; border: 1px solid #333; color: #fff; border-radius: 4px; width: 220px; font-size: 13px;">
      </div>

      <div style="overflow-x: auto;">
        <table class="admin-table">
          <thead>
            <tr>
              <th style="width: 20%;">Member</th>
              <th style="width: 15%;">Contact &amp; Zip</th>
              <th style="width: 12%;">Status</th>
              <th style="width: 10%;">Strikes</th>
              <th style="width: 23%;">Award Badge</th>
              <th style="width: 20%; text-align: right;">Moderation Actions</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <tr>
              <td colspan="6" style="text-align: center; color: #a1a1aa; padding: 30px;">Loading member records...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allUsers = [];

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      // Verify Admin Role
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', session.user.id)
        .single();

      if (error || !profile || profile.role !== 'admin') {
        alert('Unauthorized access. Admin privileges required.');
        window.location.href = 'jobs.html';
        return;
      }

      fetchUsers();
    });

    async function fetchUsers() {
      const { data: users, error } = await supabaseClient
        .from('profiles')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        alert('Error fetching users: ' + error.message);
        return;
      }

      allUsers = users || [];
      renderUserTable(allUsers);
    }

    function renderUserTable(users) {
      const tbody = document.getElementById('user-table-body');
      
      if (!users.length) {
        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #a1a1aa; padding: 20px;">No members found.</td></tr>';
        return;
      }

      tbody.innerHTML = users.map(u => {
        const badges = u.badges || [];
        const badgeListHtml = badges.length 
          ? `<div style="margin-top:4px;">${badges.map(b => `<span class="badge badge-community" style="font-size:10px; padding:2px 6px; margin-right:3px;">${b}</span>`).join('')}</div>`
          : '';

        let statusClass = 'status-pending';
        if (u.status === 'active') statusClass = 'status-active';
        if (u.status === 'banned') statusClass = 'status-banned';

        return `
          <tr>
            <td>
              <strong style="color: #fff; font-size: 15px;">${u.full_name || 'Unnamed User'}</strong>
              <div style="font-size: 11px; color: #a1a1aa; margin-top: 2px;">Role: ${u.role || 'member'}</div>
              ${badgeListHtml}
            </td>
            <td>
              <div>📞 ${u.phone || 'N/A'}</div>
              <div style="font-size: 12px; color: #a1a1aa; margin-top: 2px;">📍 ${u.zip_code || 'N/A'} (${u.max_distance || 25} mi)</div>
            </td>
            <td>
              <span class="status-pill ${statusClass}">${u.status || 'pending'}</span>
            </td>
            <td>
              <strong style="color: ${u.strikes > 0 ? '#ef4444' : '#10b981'};">${u.strikes || 0}</strong> / 3
            </td>
            <td>
              <div class="badge-select-group">
                <select id="badge-select-${u.id}" class="select-sm">
                  <option value="Verified Farm">Verified Farm</option>
                  <option value="Trusted Hand">Trusted Hand</option>
                  <option value="Community Pillar">Community Pillar</option>
                  <option value="Equipment Operator">Equipment Operator</option>
                </select>
                <button onclick="awardBadge('${u.id}')" class="btn-sm btn-add">+ Add</button>
              </div>
            </td>
            <td>
              <div class="action-group" style="justify-content: flex-end;">
                ${u.status !== 'active' ? `<button onclick="setStatus('${u.id}', 'active')" class="btn-sm btn-approve">Approve</button>` : ''}
                <button onclick="addStrike('${u.id}', ${u.strikes || 0})" class="btn-sm btn-strike">+1 Strike</button>
                ${u.status !== 'banned' ? `<button onclick="setStatus('${u.id}', 'banned')" class="btn-sm btn-ban">Ban</button>` : ''}
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    function filterUsers() {
      const query = document.getElementById('user-search').value.toLowerCase();
      const filtered = allUsers.filter(u => 
        (u.full_name && u.full_name.toLowerCase().includes(query)) ||
        (u.zip_code && u.zip_code.toLowerCase().includes(query))
      );
      renderUserTable(filtered);
    }

    async function setStatus(userId, status) {
      const { error } = await supabaseClient
        .from('profiles')
        .update({ status })
        .eq('id', userId);

      if (error) alert('Error updating status: ' + error.message);
      else fetchUsers();
    }

    async function addStrike(userId, currentStrikes) {
      const newStrikes = currentStrikes + 1;
      const updates = { strikes: newStrikes };
      
      // Auto-ban on 3 strikes
      if (newStrikes >= 3) {
        updates.status = 'banned';
        alert('Member reached 3 strikes and has been automatically banned.');
      }

      const { error } = await supabaseClient
        .from('profiles')
        .update(updates)
        .eq('id', userId);

      if (error) alert('Error issuing strike: ' + error.message);
      else fetchUsers();
    }

    async function awardBadge(userId) {
      const selectedBadge = document.getElementById(`badge-select-${userId}`).value;
      const user = allUsers.find(u => u.id === userId);
      const currentBadges = user.badges || [];

      if (currentBadges.includes(selectedBadge)) {
        alert('Member already has this badge.');
        return;
      }

      const updatedBadges = [...currentBadges, selectedBadge];

      const { error } = await supabaseClient
        .from('profiles')
        .update({ badges: updatedBadges })
        .eq('id', userId);

      if (error) alert('Error awarding badge: ' + error.message);
      else fetchUsers();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
