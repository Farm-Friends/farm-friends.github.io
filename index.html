<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rural Network | Sign In or Register</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="narrow-container">

  <!-- SIGN IN FORM -->
  <div id="login-box" class="panel">
    <h2>Sign In to Rural Network</h2>
    <form id="login-form">
      <input type="email" id="login_email" placeholder="Email Address" required />
      <input type="password" id="login_password" placeholder="Password" required />
      <button type="submit">Sign In</button>
    </form>
    <button class="toggle-btn" onclick="toggleAuth('signup')">Need an account? Apply here</button>
  </div>

  <!-- SIGN UP FORM -->
  <div id="signup-box" class="panel hidden">
    <h2>Join Rural Network</h2>
    <form id="signup-form">
      <input type="text" id="full_name" placeholder="Full Name" required />
      <input type="email" id="email" placeholder="Email Address" required />
      <input type="password" id="password" placeholder="Password" required />
      <input type="tel" id="phone" placeholder="Phone Number" required />
      <input type="text" id="zip_code" placeholder="Zip Code" required />
      <input type="email" id="referrer_email" placeholder="Referrer's Email" />
      <button type="submit">Submit Application</button>
    </form>
    <button class="toggle-btn" onclick="toggleAuth('login')">Already have an account? Sign In</button>
  </div>

  <script>
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function toggleAuth(mode) {
      if (mode === 'signup') {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('signup-box').classList.remove('hidden');
      } else {
        document.getElementById('signup-box').classList.add('hidden');
        document.getElementById('login-box').classList.remove('hidden');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('ref')) {
        document.getElementById('referrer_email').value = urlParams.get('ref');
        toggleAuth('signup'); 
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login_email').value;
      const password = document.getElementById('login_password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { alert('Login failed: ' + error.message); return; }

      const { data: profile } = await supabaseClient.from('profiles').select('status, role').eq('id', data.user.id).single();
      
      // NEW ROUTING LOGIC (Banned user check)
      if (profile?.role === 'admin') window.location.href = 'admin.html';
      else if (profile?.status === 'banned') window.location.href = 'banned.html';
      else if (profile?.status === 'active') window.location.href = 'jobs.html';
      else window.location.href = 'pending.html';
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { error } = await supabaseClient.auth.signUp({
        email: email, password: password,
        options: {
          data: {
            full_name: document.getElementById('full_name').value,
            phone: document.getElementById('phone').value,
            zip_code: document.getElementById('zip_code').value,
            referrer_email: document.getElementById('referrer_email').value
          }
        }
      });
      if (error) alert('Error: ' + error.message);
      else { alert('Application submitted!'); window.location.href = 'pending.html'; }
    });
  </script>
</body>
</html>
