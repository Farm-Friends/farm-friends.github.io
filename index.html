<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="background: #121212; color: #fff; font-family: sans-serif;">

  <main style="max-width: 420px; margin: 40px auto; padding: 20px;">
    <div class="panel" style="background: #1e1e1e; padding: 25px; border-radius: 8px; border: 1px solid #333;">
      <h2 style="margin-top: 0; color: #fff; text-align: center; font-size: 24px;">Rural Network</h2>
      
      <!-- LOGIN FORM -->
      <form id="login-form" style="margin-top: 20px;">
        <h3 style="color: #3b82f6; margin-bottom: 15px;">Log In</h3>
        
        <label style="display:block; margin-bottom:5px; color:#a1a1aa; font-size:14px;">Email</label>
        <input type="email" id="login_email" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;" />
        
        <label style="display:block; margin-bottom:5px; color:#a1a1aa; font-size:14px;">Password</label>
        <input type="password" id="login_password" required style="width: 100%; padding: 10px; margin-bottom: 20px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;" />
        
        <button type="submit" style="width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;">Log In</button>
      </form>

      <hr style="border: 0; border-top: 1px solid #333; margin: 30px 0;">

      <!-- REGISTRATION FORM -->
      <form id="signup-form">
        <h3 style="color: #10b981; margin-bottom: 15px;">Register Account</h3>
        
        <label style="display:block; margin-bottom:5px; color:#a1a1aa; font-size:14px;">Full Name</label>
        <input type="text" id="signup_name" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;" />

        <label style="display:block; margin-bottom:5px; color:#a1a1aa; font-size:14px;">Email</label>
        <input type="email" id="signup_email" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;" />
        
        <label style="display:block; margin-bottom:5px; color:#a1a1aa; font-size:14px;">Password</label>
        <input type="password" id="signup_password" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;" />

        <label style="display:block; margin-bottom:5px; color:#a1a1aa; font-size:14px;">Phone Number</label>
        <input type="tel" id="signup_phone" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;" />

        <label style="display:block; margin-bottom:5px; color:#a1a1aa; font-size:14px;">Zip Code</label>
        <input type="text" id="signup_zip" required style="width: 100%; padding: 10px; margin-bottom: 15px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;" />

        <label style="display:block; margin-bottom:5px; color:#a1a1aa; font-size:14px;">Referrer Email (Optional)</label>
        <input type="email" id="signup_referrer" style="width: 100%; padding: 10px; margin-bottom: 20px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box;" />

        <button type="submit" style="width: 100%; padding: 10px; background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 15px;">Create Account</button>
      </form>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Auto-route user on load if session exists
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        await routeUser(session.user.id);
      }
    });

    // LOGIN HANDLER
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('login_email').value;
      const password = document.getElementById('login_password').value;
      
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) { 
        alert('Login failed: ' + error.message); 
        return; 
      }

      await routeUser(data.user.id);
    });

    // SIGNUP HANDLER
    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('signup_email').value;
      const password = document.getElementById('signup_password').value;
      const fullName = document.getElementById('signup_name').value;
      const phone = document.getElementById('signup_phone').value;
      const zipCode = document.getElementById('signup_zip').value;
      const referrerEmail = document.getElementById('signup_referrer').value;

      const { data, error } = await supabaseClient.auth.signUp({
        email,
        password,
        options: {
          data: {
            full_name: fullName,
            phone: phone,
            zip_code: zipCode,
            referrer_email: referrerEmail
          }
        }
      });

      if (error) {
        alert('Registration failed: ' + error.message);
      } else {
        alert('Account created successfully!');
        if (data.user) {
          await routeUser(data.user.id);
        }
      }
    });

    // CENTRALIZED ROUTING LOGIC WITH EXPLICIT PROFILE ERRORS
    async function routeUser(userId) {
      const { data: profile, error: profileError } = await supabaseClient
        .from('profiles')
        .select('status, role')
        .eq('id', userId)
        .single();

      if (profileError || !profile) {
        alert("Error fetching profile: " + (profileError?.message || "Profile record missing in database"));
        return;
      }

      // Explicit routing rules
      if (profile.role === 'admin') {
        window.location.href = 'admin.html';
      } else if (profile.status === 'banned') {
        window.location.href = 'banned.html';
      } else if (profile.status === 'active') {
        window.location.href = 'jobs.html';
      } else {
        window.location.href = 'pending.html';
      }
    }
  </script>
</body>
</html>
