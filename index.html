<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Join Rural Network</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
    input, button { width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; }
    button { background-color: #2e7d32; color: white; border: none; cursor: pointer; }
  </style>
</head>
<body>

  <h2>Join Rural Network</h2>
  <form id="signup-form">
    <input type="text" id="full_name" placeholder="Full Name" required />
    <input type="email" id="email" placeholder="Email Address" required />
    <input type="password" id="password" placeholder="Password" required />
    <input type="tel" id="phone" placeholder="Phone Number" required />
    <input type="text" id="zip_code" placeholder="Zip Code" required />
    <input type="email" id="referrer_email" placeholder="Referrer's Email" />
    <button type="submit">Submit Application</button>
  </form>

  <script>
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } = await supabase.auth.signUp({
        email: email,
        password: password,
        options: {
          data: {
            full_name: document.getElementById('full_name').value,
            phone: document.getElementById('phone').value,
            zip_code: document.getElementById('zip_code').value,
            referrer_email: document.getElementById('referrer_email').value
          }
        }
      });

      if (error) {
        alert('Error: ' + error.message);
      } else {
        alert('Application submitted! Your account is pending admin approval.');
        window.location.href = 'pending.html';
      }
    });
  </script>
</body>
</html>
