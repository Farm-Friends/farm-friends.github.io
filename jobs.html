<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333;">
    <h1>Local Job Board</h1>
    <nav style="display: flex; align-items: center;">
      <a href="profile.html" style="color: #10b981; text-decoration: none; margin-right: 15px; font-weight: bold;">My Profile</a>
      <a href="grievance.html" style="color: #ef4444; text-decoration: none; margin-right: 15px; font-size: 14px;">File Grievance</a>
      <a href="admin.html" style="color: #a1a1aa; text-decoration: none; font-size: 14px;">Admin</a>
    </nav>
  </header>

  <main>
    <!-- JOB POST FORM -->
    <div class="panel" style="margin-bottom: 20px;">
      <h3 style="margin-top:0;">Submit a Job Request</h3>
      <form id="job-form">
        <input type="text" id="title" placeholder="Job Title (e.g., Hay Baling)" required />
        <select id="work_type" required>
          <option value="Fencing">Fencing</option>
          <option value="Livestock">Livestock</option>
          <option value="Harvest">Harvest</option>
          <option value="Equipment">Equipment Operation</option>
          <option value="General">General Labor</option>
        </select>
        <textarea id="description" placeholder="Work details..." required></textarea>
        <div class="filter-row" style="display: flex; gap: 10px;">
          <input type="number" id="hours_min" placeholder="Min Hours" required style="flex: 1;"/>
          <input type="number" id="hours_max" placeholder="Max Hours" required style="flex: 1;"/>
        </div>
        <div class="filter-row" style="display: flex; gap: 10px;">
          <input type="text" id="zip_code" placeholder="Zip Code" required style="flex: 1;"/>
          <input type="tel" id="contact_phone" placeholder="Contact Phone Number" required style="flex: 1;"/>
        </div>
        <input type="date" id="date_needed" required />
        <label style="display:block; margin-bottom:15px; cursor: pointer;"><input type="checkbox" id="is_emergency" style="display:inline; width:auto;"> Emergency / Short-Notice Job</label>
        <button type="submit">Post Job</button>
      </form>
    </div>

    <!-- Filters -->
    <div style="background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap;">
      <div>
        <label for="filter_type" style="display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 5px;">Work Type</label>
        <select id="filter_type" style="padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;" onchange="fetchJobs()">
          <option value="">All Types</option>
          <option value="Fencing">Fencing</option>
          <option value="Livestock">Livestock</option>
          <option value="Harvest">Harvest</option>
          <option value="Equipment">Equipment Operation</option>
          <option value="General">General Labor</option>
        </select>
      </div>
      <div>
        <label for="filter_zip" style="display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 5px;">Zip Code</label>
        <input type="text" id="filter_zip" placeholder="e.g. 90210" style="padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;" onkeyup="fetchJobs()">
      </div>
    </div>

    <!-- Job List Container -->
    <div id="job-list" style="display: flex; flex-direction: column; gap: 20px;">
      <p>Loading jobs...</p>
    </div>
  </main>

  <!-- PUBLIC PROFILE BADGE MODAL -->
  <div id="profile-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.75); justify-content:center; align-items:center; z-index:1000;">
    <div style="background:#1e1e1e; padding:25px; border-radius:8px; border:1px solid #333; max-width:380px; width:90%; text-align:center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
      <h3 id="modal-user-name" style="margin-top:0; color:#fff;">User Badges</h3>
      <p style="color:#a1a1aa; font-size:13px; margin-bottom:15px;">Community Badges & Verified Credentials</p>
      <div id="modal-badges" class="badge-container" style="justify-content:center; margin-bottom:20px;"></div>
      <button onclick="closeProfileModal()" style="background:#3b82f6; color:white; border:none; padding:8px 16px; border-radius:4px; cursor:pointer;">Close</button>
    </div>
  </div>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      // Kick out unauthenticated visitors immediately
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUserId = session.user.id;

      // Verify account status
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('status, role')
        .eq('id', currentUserId)
        .single();

      if (error || !profile) {
        alert('Error verifying account credentials. Please log in again.');
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
        return;
      }

      if (profile.status === 'banned') {
        window.location.href = 'banned.html';
        return;
      }

      if (profile.status === 'pending' && profile.role !== 'admin') {
        window.location.href = 'pending.html';
        return;
      }

      fetchJobs();
    });

    // Handle Job Submission
    document.getElementById('job-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await supabaseClient.from('jobs').insert([{
        poster_id: currentUserId, 
        title: document.getElementById('title').value,
        work_type: document.getElementById('work_type').value, 
        description: document.getElementById('description').value,
        hours_min: document.getElementById('hours_min').value, 
        hours_max: document.getElementById('hours_max').value,
        zip_code: document.getElementById('zip_code').value, 
        contact_phone: document.getElementById('contact_phone').value,
        date_needed: document.getElementById('date_needed').value, 
        is_emergency: document.getElementById('is_emergency').checked
      }]);
      if (error) alert('Error posting job: ' + error.message);
      else { 
        document.getElementById('job-form').reset(); 
        fetchJobs(); 
        alert('Job posted successfully!');
      }
    });

    async function fetchJobs() {
      const typeFilter = document.getElementById('filter_type').value;
      const zipFilter = document.getElementById('filter_zip').value;
      
      let query = supabaseClient.from('jobs').select('*, profiles(full_name, badges)').eq('status', 'open');
      if (typeFilter) query = query.eq('work_type', typeFilter);
      if (zipFilter) query = query.eq('zip_code', zipFilter);
      
      const { data: jobs, error } = await query.order('created_at', { ascending: false });
      const container = document.getElementById('job-list');
      
      if (error || !jobs || !jobs.length) { 
        container.innerHTML = '<p>No open jobs match your criteria.</p>'; 
        return; 
      }
      
      container.innerHTML = jobs.map(j => {
        const isOwner = j.poster_id === currentUserId;
        const posterName = j.profiles?.full_name || 'Network Member';
        const badges = j.profiles?.badges || [];
        
        const badgeDisplay = badges.map(b => {
          let badgeClass = 'badge-community';
          if (b.includes('Farmer')) badgeClass = 'badge-farmer';
          if (b.includes('Hand')) badgeClass = 'badge-worker';
          return `<span class="badge ${badgeClass}">${b}</span>`;
        }).join('');

        let managementButtons = '';
        if (isOwner) {
          managementButtons = `
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #333; display: flex; gap: 10px;">
              <button onclick="markJobFilled('${j.id}')" style="background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 8px 12px; font-size: 14px;">Mark as Filled</button>
              <button onclick="deleteJob('${j.id}')" style="background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 8px 12px; font-size: 14px;">Delete Post</button>
            </div>
          `;
        }

        const emergencyBorder = j.is_emergency ? 'border: 1px solid #ef4444;' : 'border: 1px solid #333;';

        return `
          <div class="job-card" style="background: #1e1e1e; padding: 20px; border-radius: 8px; ${emergencyBorder}">
            <div style="margin-bottom: 10px;">
              <a href="javascript:void(0)" 
                 onclick="openPublicProfile('${posterName}', '${encodeURIComponent(JSON.stringify(badges))}')" 
                 style="color: #3b82f6; text-decoration: underline; font-weight: bold; font-size: 14px;">
                Posted by ${posterName} 🔍
              </a>
              <div class="badge-container" style="margin-top: 5px;">${badgeDisplay}</div>
            </div>
            <h3 style="margin-top:0; color: #fff;">${j.title} ${j.is_emergency ? '🚨 <span style="color:#ef4444; font-size: 14px;">[EMERGENCY]</span>' : ''}</h3>
            <p style="color: #ccc;"><strong>Type:</strong> ${j.work_type} | <strong>Location:</strong> Zip ${j.zip_code}</p>
            <p style="color: #ddd;">${j.description}</p>
            <p style="color: #ccc;"><strong>Est. Time:</strong> ${j.hours_min} - ${j.hours_max} hrs | <strong>Date Needed:</strong> ${j.date_needed}</p>
            <p style="color: #ccc;"><strong>Contact:</strong> ${j.contact_phone}</p>
            ${managementButtons}
          </div>
        `;
      }).join('');
    }

    // --- PUBLIC PROFILE MODAL FUNCTIONS ---
    function openPublicProfile(name, badgesStr) {
      const badges = JSON.parse(decodeURIComponent(badgesStr));
      document.getElementById('modal-user-name').innerText = name;
      const badgeContainer = document.getElementById('modal-badges');
      
      if (!badges.length) {
        badgeContainer.innerHTML = '<p style="color:#a1a1aa; font-size:13px;">This member has not been awarded any badges yet.</p>';
      } else {
        badgeContainer.innerHTML = badges.map(b => {
          let badgeClass = 'badge-community';
          if (b.includes('Farmer')) badgeClass = 'badge-farmer';
          if (b.includes('Hand')) badgeClass = 'badge-worker';
          return `<span class="badge ${badgeClass}" style="font-size:13px; padding:5px 10px;">${b}</span>`;
        }).join('');
      }
      document.getElementById('profile-modal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').style.display = 'none';
    }

    async function markJobFilled(jobId) {
      if (!confirm("Are you sure you want to mark this job as filled? It will be removed from the public board.")) return;
      const { data, error } = await supabaseClient
        .from('jobs')
        .update({ status: 'filled' })
        .eq('id', jobId)
        .select();

      if (error) {
        alert("Error updating job: " + error.message);
      } else if (!data || data.length === 0) {
        alert("Could not update job. Ensure your Supabase RLS policy allows UPDATE for job owners.");
      } else {
        fetchJobs();
      }
    }

    async function deleteJob(jobId) {
      if (!confirm("Are you sure you want to permanently delete this job post?")) return;
      
      const { data, error } = await supabaseClient
        .from('jobs')
        .delete()
        .eq('id', jobId)
        .select();

      if (error) {
        alert("Error deleting job: " + error.message);
      } else if (!data || data.length === 0) {
        alert("Could not delete job. Please verify that your Supabase 'jobs' table has a Row Level Security (RLS) policy enabling DELETE for authenticated users matching poster_id = auth.uid().");
      } else {
        fetchJobs();
      }
    }
  </script>
</body>
</html>
