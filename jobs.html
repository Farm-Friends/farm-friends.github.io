<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333;">
    <h1>Local Job Board</h1>
    <nav>
      <!-- Update these links based on your actual file names -->
      <a href="post-job.html" style="background: #3b82f6; color: white; padding: 8px 16px; text-decoration: none; border-radius: 4px; font-weight: bold;">+ Post a Job</a>
      <a href="admin.html" style="color: #a1a1aa; text-decoration: none; margin-left: 15px;">Admin</a>
    </nav>
  </header>

  <main>
    <!-- Filters -->
    <div style="background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap;">
      <div>
        <label for="filter_type" style="display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 5px;">Work Type</label>
        <select id="filter_type" style="padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;" onchange="fetchJobs()">
          <option value="">All Types</option>
          <option value="Fencing">Fencing</option>
          <option value="Livestock">Livestock Handling</option>
          <option value="Harvest">Harvesting</option>
          <option value="Equipment">Equipment Operation</option>
          <option value="General">General Labor</option>
        </select>
      </div>
      <div>
        <label for="filter_zip" style="display: block; font-size: 12px; color: #a1a1aa; margin-bottom: 5px;">Zip Code</label>
        <input type="text" id="filter_zip" placeholder="e.g. 90210" style="padding: 8px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;" onkeyup="fetchJobs()">
      </div>
    </div>

    <!-- Job List Container -->
    <div id="job-list" style="display: flex; flex-direction: column; gap: 20px;">
      <p>Loading jobs...</p>
    </div>
  </main>

  <script>
    // Initialize Supabase (Replace with your actual initialization if using a separate config file)
    // const supabaseUrl = 'YOUR_SUPABASE_URL';
    // const supabaseKey = 'YOUR_SUPABASE_ANON_KEY';
    // const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let currentUserId = null;

    // Run when page loads to get user session and then fetch jobs
    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        currentUserId = session.user.id;
      }
      fetchJobs();
    });

    async function fetchJobs() {
      const typeFilter = document.getElementById('filter_type').value;
      const zipFilter = document.getElementById('filter_zip').value;
      
      // Use a join query to grab the poster's profile data simultaneously
      let query = supabaseClient.from('jobs').select('*, profiles(full_name, badges)').eq('status', 'open');
      if (typeFilter) query = query.eq('work_type', typeFilter);
      if (zipFilter) query = query.eq('zip_code', zipFilter);
      
      const { data: jobs, error } = await query.order('created_at', { ascending: false });
      const container = document.getElementById('job-list');
      
      if (error || !jobs || !jobs.length) { 
        container.innerHTML = '<p>No open jobs match your criteria.</p>'; 
        return; 
      }
      
      container.innerHTML = jobs.map(j => {
        const isOwner = j.poster_id === currentUserId;
        const posterName = j.profiles?.full_name || 'Network Member';
        const badges = j.profiles?.badges || [];
        
        // Render badges based on text content to apply the correct color class
        const badgeDisplay = badges.map(b => {
          let badgeClass = 'badge-community';
          if (b.includes('Farmer')) badgeClass = 'badge-farmer';
          if (b.includes('Hand')) badgeClass = 'badge-worker';
          return `<span class="badge ${badgeClass}">${b}</span>`;
        }).join('');

        let managementButtons = '';
        if (isOwner) {
          managementButtons = `
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #333; display: flex; gap: 10px;">
              <button onclick="markJobFilled('${j.id}')" style="background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 8px 12px; font-size: 14px;">Mark as Filled</button>
              <button onclick="deleteJob('${j.id}')" style="background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 8px 12px; font-size: 14px;">Delete Post</button>
            </div>
          `;
        }

        // Inline border color for emergency jobs, assuming standard card styling is in style.css
        const emergencyBorder = j.is_emergency ? 'border: 1px solid #ef4444;' : 'border: 1px solid #333;';

        return `
          <div class="job-card" style="background: #1e1e1e; padding: 20px; border-radius: 8px; ${emergencyBorder}">
            <div style="margin-bottom: 10px;">
              <strong style="color: #a1a1aa; font-size: 14px;">Posted by ${posterName}</strong>
              <div class="badge-container">${badgeDisplay}</div>
            </div>
            <h3 style="margin-top:0; color: #fff;">${j.title} ${j.is_emergency ? '🚨 <span style="color:#ef4444; font-size: 14px;">[EMERGENCY]</span>' : ''}</h3>
            <p style="color: #ccc;"><strong>Type:</strong> ${j.work_type} | <strong>Location:</strong> Zip ${j.zip_code}</p>
            <p style="color: #ddd;">${j.description}</p>
            <p style="color: #ccc;"><strong>Est. Time:</strong> ${j.hours_min} - ${j.hours_max} hrs | <strong>Date Needed:</strong> ${j.date_needed}</p>
            <p style="color: #ccc;"><strong>Contact:</strong> ${j.contact_phone}</p>
            ${managementButtons}
          </div>
        `;
      }).join('');
    }

    // --- JOB MANAGEMENT FUNCTIONS ---
    async function markJobFilled(jobId) {
      if (!confirm("Are you sure you want to mark this job as filled? It will be removed from the public board.")) return;
      const { error } = await supabaseClient.from('jobs').update({ status: 'filled' }).eq('id', jobId);
      if (error) alert("Error updating job: " + error.message);
      else fetchJobs();
    }

    async function deleteJob(jobId) {
      if (!confirm("Are you sure you want to permanently delete this job post?")) return;
      const { error } = await supabaseClient.from('jobs').delete().eq('id', jobId);
      if (error) alert("Error deleting job: " + error.message);
      else fetchJobs();
    }
  </script>
</body>
</html>
