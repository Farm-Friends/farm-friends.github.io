<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .jobs-container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 15px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Styled Horizontal Divider */
    .section-divider {
      display: flex;
      align-items: center;
      margin: 45px 0 35px 0;
      gap: 15px;
    }

    .section-divider hr {
      flex: 1;
      border: none;
      border-top: 1px solid #333;
      margin: 0;
    }

    .section-divider-label {
      background: #2a2a2a;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #333;
      white-space: nowrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      color: #a1a1aa;
      font-weight: 600;
      text-transform: uppercase;
    }

    input, select, textarea {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .btn-primary {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.15s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .job-item {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      transition: border-color 0.15s ease;
    }

    .job-item:hover {
      border-color: #444;
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .job-meta {
      display: flex;
      gap: 15px;
      font-size: 13px;
      color: #a1a1aa;
      margin-top: 8px;
    }

    .job-pay {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid #10b981;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="jobs-container">
    <!-- NAVIGATION & DASHBOARD HEADER -->
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid #333;">
      <div>
        <h1 style="margin: 0; font-size: 26px;">🌾 Rural Network Jobs</h1>
        <p style="margin: 5px 0 0 0; color: #a1a1aa; font-size: 14px;">Connect with local farms, hands, and equipment operators</p>
      </div>
      <nav style="display: flex; align-items: center; gap: 15px;">
        <a href="profile.html" style="color: #3b82f6; text-decoration: none; font-size: 14px;">My Profile</a>
        <a href="grievance.html" style="color: #ef4444; text-decoration: none; font-size: 14px;">File Report</a>
        <a id="admin-link" href="admin.html" style="display: none; color: #f59e0b; text-decoration: none; font-size: 14px; font-weight: bold;">Admin Panel</a>
        <button onclick="logout()" style="background: #333; color: #aaa; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Log Out</button>
      </nav>
    </header>

    <!-- SECTION 1: POST A JOB -->
    <section class="card">
      <div class="section-title">
        <span>➕</span> Post a New Job Opportunity
      </div>
      <form id="job-form" onsubmit="createJob(event)">
        <div class="form-grid">
          <div class="form-group" style="grid-column: span 2;">
            <label>Job Title</label>
            <input type="text" id="job-title" placeholder="e.g. Fence Repair &amp; Hay Baling" required>
          </div>
          <div class="form-group">
            <label>Pay / Compensation</label>
            <input type="text" id="job-pay" placeholder="e.g. $25/hr or $200 Flat" required>
          </div>
          <div class="form-group">
            <label>Location Zip Code</label>
            <input type="text" id="job-zip" placeholder="e.g. 43210" required maxlength="5">
          </div>
        </div>
        <div class="form-group" style="margin-bottom: 18px;">
          <label>Job Description &amp; Requirements</label>
          <textarea id="job-desc" rows="3" placeholder="Describe the tasks, tools provided, or experience needed..." required></textarea>
        </div>
        <button type="submit" class="btn-primary">Publish Job Posting</button>
      </form>
    </section>

    <!-- SECTION DIVIDER -->
    <div class="section-divider">
      <hr>
      <span class="section-divider-label">📋 Community Listings Feed</span>
      <hr>
    </div>

    <!-- SECTION 2: JOB POSTINGS FEED -->
    <section>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <div class="section-title" style="margin: 0;">
          <span>🔍</span> Available Job Postings
        </div>
        <input type="text" id="job-search" placeholder="Filter jobs by title, description, or zip..." onkeyup="filterJobs()" style="width: 280px; padding: 8px 12px;">
      </div>

      <div id="jobs-list">
        <div style="text-align: center; color: #a1a1aa; padding: 40px; background: #1e1e1e; border-radius: 8px; border: 1px solid #333;">
          Loading local job listings...
        </div>
      </div>
    </section>
  </div>

  <script>
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allJobs = [];
    let currentUser = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUser = session.user;

      // Check for Admin privileges to display link
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', currentUser.id)
        .single();

      if (profile && profile.role === 'admin') {
        document.getElementById('admin-link').style.display = 'inline';
      }

      await fetchJobs();
    });

    async function fetchJobs() {
      const { data: jobs, error } = await supabaseClient
        .from('jobs')
        .select('*, profiles(full_name, phone)')
        .order('created_at', { ascending: false });

      if (error) {
        document.getElementById('jobs-list').innerHTML = `
          <div style="text-align: center; color: #ef4444; padding: 30px;" class="card">
            Failed to load jobs: ${error.message}
          </div>`;
        return;
      }

      allJobs = jobs || [];
      renderJobs(allJobs);
    }

    function renderJobs(jobs) {
      const container = document.getElementById('jobs-list');

      if (!jobs.length) {
        container.innerHTML = `
          <div style="text-align: center; color: #a1a1aa; padding: 40px;" class="card">
            No active job postings found. Be the first to post above!
          </div>`;
        return;
      }

      container.innerHTML = jobs.map(j => {
        const posterName = j.profiles ? j.profiles.full_name : 'Community Member';
        const posterPhone = j.profiles ? j.profiles.phone : 'N/A';

        return `
          <div class="job-item">
            <div class="job-header">
              <div>
                <h3 style="margin: 0 0 6px 0; color: #fff; font-size: 18px;">${j.title}</h3>
                <div style="font-size: 13px; color: #3b82f6;">Posted by: <strong>${posterName}</strong></div>
              </div>
              <span class="job-pay">${j.pay}</span>
            </div>
            <p style="color: #ccc; font-size: 14px; margin: 12px 0; line-height: 1.5;">${j.description}</p>
            <div class="job-meta">
              <span>📍 Zip Code: <strong>${j.zip_code}</strong></span>
              <span>📞 Contact: <strong>${posterPhone}</strong></span>
              <span>📅 Posted: <strong>${new Date(j.created_at).toLocaleDateString()}</strong></span>
            </div>
          </div>
        `;
      }).join('');
    }

    async function createJob(e) {
      e.preventDefault();
      const title = document.getElementById('job-title').value;
      const pay = document.getElementById('job-pay').value;
      const zip_code = document.getElementById('job-zip').value;
      const description = document.getElementById('job-desc').value;

      const { error } = await supabaseClient
        .from('jobs')
        .insert([{
          user_id: currentUser.id,
          title,
          pay,
          zip_code,
          description
        }]);

      if (error) {
        alert('Error creating job: ' + error.message);
      } else {
        document.getElementById('job-form').reset();
        await fetchJobs();
      }
    }

    function filterJobs() {
      const query = document.getElementById('job-search').value.toLowerCase();
      const filtered = allJobs.filter(j => 
        j.title.toLowerCase().includes(query) ||
        j.description.toLowerCase().includes(query) ||
        j.zip_code.toLowerCase().includes(query)
      );
      renderJobs(filtered);
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
