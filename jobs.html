<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Board | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="header">
    <h2>Rural Network Job Board</h2>
    <div>
      <button class="btn-logout" style="background: #8b5a2b; margin-right: 8px;" onclick="toggleReportForm()">Report an Issue</button>
      <button class="btn-logout" style="background: #4a7c59; margin-right: 8px;" onclick="window.location.href='profile.html'">My Profile</button>
      <button class="btn-logout" onclick="logout()">Log Out</button>
    </div>
  </div>

  <!-- REPORT FORM (Hidden by default) -->
  <div id="report-box" class="panel hidden" style="border: 2px solid #c9302c;">
    <h3 style="margin-top:0; color: #c9302c;">Report a Grievance</h3>
    <p style="font-size: 14px;">If a worker or job poster acted unprofessionally, didn't show up, or caused issues, let the admins know.</p>
    <form id="report-form">
      <input type="text" id="offender_info" placeholder="Name and/or Phone Number of the person" required />
      <textarea id="report_description" placeholder="What happened?" required></textarea>
      <button type="submit" style="background: #c9302c;">Submit to Admin</button>
      <button type="button" class="toggle-btn" onclick="toggleReportForm()">Cancel</button>
    </form>
  </div>

  <div class="panel">
    <h3 style="margin-top:0;">Filter Jobs</h3>
    <div class="filter-row">
      <select id="filter_type">
        <option value="">All Job Types</option>
        <option value="Fencing">Fencing</option>
        <option value="Livestock">Livestock</option>
        <option value="Harvest">Harvest</option>
        <option value="Maintenance">General Maintenance</option>
      </select>
      <input type="text" id="filter_zip" placeholder="Zip Code (optional)" />
      <button onclick="fetchJobs()">Search</button>
    </div>
  </div>

  <div class="panel">
    <h3 style="margin-top:0;">Submit a Job Request</h3>
    <form id="job-form">
      <input type="text" id="title" placeholder="Job Title (e.g., Hay Baling)" required />
      <select id="work_type" required>
        <option value="Fencing">Fencing</option>
        <option value="Livestock">Livestock</option>
        <option value="Harvest">Harvest</option>
        <option value="Maintenance">General Maintenance</option>
      </select>
      <textarea id="description" placeholder="Work details..." required></textarea>
      <div class="filter-row">
        <input type="number" id="hours_min" placeholder="Min Hours" required />
        <input type="number" id="hours_max" placeholder="Max Hours" required />
      </div>
      <div class="filter-row">
        <input type="text" id="zip_code" placeholder="Zip Code" required />
        <input type="tel" id="contact_phone" placeholder="Contact Phone Number" required />
      </div>
      <input type="date" id="date_needed" required />
      <label style="display:block; margin-bottom:15px;"><input type="checkbox" id="is_emergency" style="display:inline; width:auto;"> Emergency / Short-Notice Job</label>
      <button type="submit">Post Job</button>
    </form>
  </div>

  <h2>Available Listings</h2>
  <div id="job-list">Loading jobs...</div>

  <script>
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    let currentUserId = null;

    async function checkAccessAndLoad() {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) { window.location.href = 'index.html'; return; }
      
      currentUserId = user.id;

      const { data: profile } = await supabaseClient.from('profiles').select('status, role').eq('id', user.id).single();
      if (!profile || (profile.status !== 'active' && profile.role !== 'admin')) {
        window.location.href = 'pending.html';
        return;
      }
      fetchJobs();
    }

    // Toggle Grievance Form
    function toggleReportForm() {
      const box = document.getElementById('report-box');
      box.classList.toggle('hidden');
    }

    // Submit Grievance
    document.getElementById('report-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await supabaseClient.from('reports').insert([{
        reporter_id: currentUserId,
        offender_info: document.getElementById('offender_info').value,
        description: document.getElementById('report_description').value
      }]);
      
      if (error) {
        alert('Error submitting report: ' + error.message);
      } else {
        alert('Report submitted successfully. An admin will review it shortly.');
        document.getElementById('report-form').reset();
        toggleReportForm();
      }
    });

    async function fetchJobs() {
      const typeFilter = document.getElementById('filter_type').value;
      const zipFilter = document.getElementById('filter_zip').value;
      
      let query = supabaseClient.from('jobs').select('*').eq('status', 'open');
      if (typeFilter) query = query.eq('work_type', typeFilter);
      if (zipFilter) query = query.eq('zip_code', zipFilter);
      
      const { data: jobs, error } = await query.order('created_at', { ascending: false });
      const container = document.getElementById('job-list');
      
      if (error || !jobs || !jobs.length) { 
        container.innerHTML = '<p>No open jobs match your criteria.</p>'; 
        return; 
      }
      
      container.innerHTML = jobs.map(j => {
        const isOwner = j.poster_id === currentUserId;
        
        let managementButtons = '';
        if (isOwner) {
          managementButtons = `
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #e0dcd3; display: flex; gap: 10px;">
              <button onclick="markJobFilled('${j.id}')" style="background: #2c4c3b; padding: 8px; font-size: 14px;">Mark as Filled</button>
              <button onclick="deleteJob('${j.id}')" style="background: #c9302c; padding: 8px; font-size: 14px;">Delete Post</button>
            </div>
          `;
        }

        return `
          <div class="job-card ${j.is_emergency ? 'emergency' : ''}">
            <h3 style="margin-top:0;">${j.title} ${j.is_emergency ? '🚨 [EMERGENCY]' : ''}</h3>
            <p><strong>Type:</strong> ${j.work_type} | <strong>Location:</strong> Zip ${j.zip_code}</p>
            <p>${j.description}</p>
            <p><strong>Est. Time:</strong> ${j.hours_min} - ${j.hours_max} hrs | <strong>Date Needed:</strong> ${j.date_needed}</p>
            <p><strong>Contact:</strong> ${j.contact_phone}</p>
            ${managementButtons}
          </div>
        `;
      }).join('');
    }

    async function markJobFilled(jobId) {
      if (!confirm("Are you sure you want to mark this job as filled? It will be removed from the job board.")) return;
      const { error } = await supabaseClient.from('jobs').update({ status: 'filled' }).eq('id', jobId);
      if (error) alert('Error: ' + error.message);
      else fetchJobs();
    }

    async function deleteJob(jobId) {
      if (!confirm("Are you sure you want to delete this job posting? This cannot be undone.")) return;
      const { error } = await supabaseClient.from('jobs').delete().eq('id', jobId);
      if (error) alert('Error: ' + error.message);
      else fetchJobs();
    }

    document.getElementById('job-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await supabaseClient.from('jobs').insert([{
        poster_id: currentUserId, title: document.getElementById('title').value,
        work_type: document.getElementById('work_type').value, description: document.getElementById('description').value,
        hours_min: document.getElementById('hours_min').value, hours_max: document.getElementById('hours_max').value,
        zip_code: document.getElementById('zip_code').value, contact_phone: document.getElementById('contact_phone').value,
        date_needed: document.getElementById('date_needed').value, is_emergency: document.getElementById('is_emergency').checked
      }]);
      if (error) alert('Error posting job: ' + error.message);
      else { document.getElementById('job-form').reset(); fetchJobs(); }
    });

    async function logout() { await supabaseClient.auth.signOut(); window.location.href = 'index.html'; }
    checkAccessAndLoad();
  </script>
</body>
</html>
