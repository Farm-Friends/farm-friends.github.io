<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .jobs-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 15px;
    }

    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 25px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin: 0 0 15px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section-divider {
      display: flex;
      align-items: center;
      margin: 40px 0 30px 0;
      gap: 15px;
    }

    .section-divider hr {
      flex: 1;
      border: none;
      border-top: 1px solid #333;
      margin: 0;
    }

    .section-divider-label {
      background: #2a2a2a;
      color: #a1a1aa;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #333;
      white-space: nowrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 15px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 11px;
      color: #a1a1aa;
      font-weight: 600;
      text-transform: uppercase;
    }

    input, select, textarea {
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }

    .btn-primary {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: opacity 0.15s;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .job-card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 16px;
      transition: border-color 0.15s ease;
    }

    .job-card.emergency {
      border-color: #ef4444 !important;
      background: rgba(239, 68, 68, 0.05);
    }

    .job-meta-tag {
      display: inline-block;
      background: #2a2a2a;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #a1a1aa;
      margin-right: 8px;
      margin-top: 4px;
    }

    .pay-badge {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border: 1px solid #10b981;
      padding: 3px 10px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 12px;
      white-space: nowrap;
    }

    #profile-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      background: #1e1e1e;
      padding: 25px;
      border-radius: 8px;
      border: 1px solid #333;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>

  <div class="jobs-container">
    <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid #333;">
      <div>
        <h1 style="margin: 0; font-size: 24px;">🌾 Rural Network Job Board</h1>
        <p style="margin: 4px 0 0 0; color: #a1a1aa; font-size: 13px;">Local community labor, equipment sharing, and farm requests</p>
      </div>
      <nav style="display: flex; align-items: center; gap: 15px;">
        <a href="profile.html" style="color: #10b981; text-decoration: none; font-weight: bold; font-size: 14px;">My Profile</a>
        <a href="grievance.html" style="color: #ef4444; text-decoration: none; font-size: 14px;">File Grievance</a>
        <a id="admin-link" href="admin.html" style="display: none; color: #f59e0b; text-decoration: none; font-size: 14px; font-weight: bold;">Admin Panel</a>
        <button onclick="logout()" style="background: #333; color: #aaa; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">Log Out</button>
      </nav>
    </header>

    <section class="card">
      <div class="section-title">
        <span>➕</span> Submit a Job Request
      </div>
      <form id="job-form">
        <div class="form-grid">
          <div class="form-group" style="grid-column: span 2;">
            <label>Job Title</label>
            <input type="text" id="title" placeholder="Job Title (e.g., Hay Baling &amp; Stacking)" required />
          </div>
          <div class="form-group">
            <label>Type of Work</label>
            <select id="work_type" required>
              <option value="Fencing">Fencing</option>
              <option value="Livestock">Livestock</option>
              <option value="Harvest">Harvest</option>
              <option value="Equipment">Equipment Operation</option>
              <option value="General">General Labor</option>
            </select>
          </div>
          <div class="form-group">
            <label>Pay / Compensation</label>
            <input type="text" id="pay" placeholder="e.g. $25/hr or $200 Flat" required />
          </div>
        </div>

        <div class="form-group" style="margin-bottom: 15px;">
          <label>Work Details &amp; Requirements</label>
          <textarea id="description" rows="3" placeholder="Describe specific tasks, equipment provided, or physical requirements..." required></textarea>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>Min Hours</label>
            <input type="number" id="hours_min" placeholder="e.g. 2" min="1" required />
          </div>
          <div class="form-group">
            <label>Max Hours</label>
            <input type="number" id="hours_max" placeholder="e.g. 8" min="1" required />
          </div>
          <div class="form-group">
            <label>Zip Code</label>
            <input type="text" id="zip_code" placeholder="e.g. 43210" maxlength="5" required />
          </div>
          <div class="form-group">
            <label>Date Needed</label>
            <input type="date" id="date_needed" required />
          </div>
          <div class="form-group">
            <label>Contact Phone</label>
            <input type="tel" id="contact_phone" placeholder="(555) 000-0000" required />
          </div>
        </div>

        <div style="margin: 15px 0 20px 0;">
          <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; color: #ef4444; font-weight: bold; font-size: 13px;">
            <input type="checkbox" id="is_emergency" style="width: auto; height: auto;"> 🚨 Emergency / Short-Notice Job
          </label>
        </div>

        <button type="submit" class="btn-primary">Post Job</button>
      </form>
    </section>

    <div class="section-divider">
      <hr>
      <span class="section-divider-label">📋 Available Job Listings Feed</span>
      <hr>
    </div>

    <section>
      <div style="background: #1e1e1e; padding: 15px; border-radius: 8px; border: 1px solid #333; margin-bottom: 20px; display: flex; gap: 15px; flex-wrap: wrap; align-items: center;">
        <div>
          <label for="filter_type" style="display: block; font-size: 11px; color: #a1a1aa; text-transform: uppercase; margin-bottom: 4px; font-weight: 600;">Work Type</label>
          <select id="filter_type" style="padding: 7px 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;" onchange="fetchJobs()">
            <option value="">All Types</option>
            <option value="Fencing">Fencing</option>
            <option value="Livestock">Livestock</option>
            <option value="Harvest">Harvest</option>
            <option value="Equipment">Equipment Operation</option>
            <option value="General">General Labor</option>
          </select>
        </div>
        <div>
          <label for="filter_zip" style="display: block; font-size: 11px; color: #a1a1aa; text-transform: uppercase; margin-bottom: 4px; font-weight: 600;">Zip Code</label>
          <input type="text" id="filter_zip" placeholder="Filter by Zip..." style="padding: 7px 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;" onkeyup="fetchJobs()">
        </div>
      </div>

      <div id="job-list" style="display: flex; flex-direction: column; gap: 15px;">
        <div style="text-align: center; color: #a1a1aa; padding: 30px;" class="card">
          Loading jobs...
        </div>
      </div>
    </section>
  </div>

  <div id="profile-modal">
    <div class="modal-content">
      <h3 id="modal-user-name" style="margin-top: 0; color: #fff;">User Badges</h3>
      <p style="color: #a1a1aa; font-size: 13px; margin-bottom: 15px;">Community Badges &amp; Verified Credentials</p>
      <div id="modal-badges" class="badge-container" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-bottom: 20px;"></div>
      <button onclick="closeProfileModal()" style="background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: 600;">Close</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      currentUserId = session.user.id;

      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('status, role')
        .eq('id', currentUserId)
        .single();

      if (error || !profile) {
        alert('Error verifying account credentials. Please log in again.');
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
        return;
      }

      if (profile.status === 'banned') {
        window.location.href = 'banned.html';
        return;
      }

      if (profile.status === 'pending' && profile.role !== 'admin') {
        window.location.href = 'pending.html';
        return;
      }

      if (profile.role === 'admin') {
        document.getElementById('admin-link').style.display = 'inline';
      }

      fetchJobs();
    });

    // Handle Job Submission
    document.getElementById('job-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const { error } = await supabaseClient.from('jobs').insert([{
        poster_id: currentUserId, 
        title: document.getElementById('title').value,
        work_type: document.getElementById('work_type').value, 
        pay: document.getElementById('pay').value,
        description: document.getElementById('description').value,
        hours_min: document.getElementById('hours_min').value, 
        hours_max: document.getElementById('hours_max').value,
        zip_code: document.getElementById('zip_code').value, 
        contact_phone: document.getElementById('contact_phone').value,
        date_needed: document.getElementById('date_needed').value, 
        is_emergency: document.getElementById('is_emergency').checked,
        status: 'open' // Explicitly set status to match fetch criteria
      }]);

      if (error) {
        alert('Error posting job: ' + error.message);
      } else { 
        document.getElementById('job-form').reset(); 
        fetchJobs(); 
        alert('Job posted successfully!');
      }
    });

    async function fetchJobs() {
      const typeFilter = document.getElementById('filter_type').value;
      const zipFilter = document.getElementById('filter_zip').value;
      
      // Fix timezone offset issue by retrieving local YYYY-MM-DD
      const localDate = new Date();
      const today = `${localDate.getFullYear()}-${String(localDate.getMonth() + 1).padStart(2, '0')}-${String(localDate.getDate()).padStart(2, '0')}`;

      // Query jobs with status 'open' or 'active'
      let query = supabaseClient
        .from('jobs')
        .select('*, profiles(full_name, badges)')
        .in('status', ['open', 'active'])
        .gte('date_needed', today);

      if (typeFilter) query = query.eq('work_type', typeFilter);
      if (zipFilter) query = query.eq('zip_code', zipFilter);
      
      const { data: jobs, error } = await query.order('created_at', { ascending: false });
      const container = document.getElementById('job-list');
      
      if (error) {
        console.error('Fetch Jobs Error:', error);
        container.innerHTML = `<div style="text-align: center; color: #ef4444; padding: 30px;" class="card">Error loading jobs: ${error.message}</div>`;
        return;
      }

      if (!jobs || !jobs.length) { 
        container.innerHTML = '<div style="text-align: center; color: #a1a1aa; padding: 30px;" class="card">No open jobs match your criteria.</div>'; 
        return; 
      }
      
      container.innerHTML = jobs.map(j => {
        const isOwner = j.poster_id === currentUserId;
        const posterName = j.profiles?.full_name || 'Network Member';
        const badges = j.profiles?.badges || [];
        
        const badgeDisplay = badges.map(b => {
          let badgeClass = 'badge-community';
          if (b.includes('Farm')) badgeClass = 'badge-farmer';
          if (b.includes('Hand')) badgeClass = 'badge-worker';
          return `<span class="badge ${badgeClass}">${b}</span>`;
        }).join('');

        let managementButtons = '';
        if (isOwner) {
          managementButtons = `
            <div style="margin-top: 15px; padding-top: 12px; border-top: 1px solid #333; display: flex; gap: 10px;">
              <button onclick="markJobFilled('${j.id}')" style="background: #10b981; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 6px 12px; font-size: 13px; font-weight: 600;">Mark as Filled</button>
              <button onclick="deleteJob('${j.id}')" style="background: #ef4444; color: white; border: none; border-radius: 4px; cursor: pointer; padding: 6px 12px; font-size: 13px; font-weight: 600;">Delete Post</button>
            </div>
          `;
        }

        const emergencyClass = j.is_emergency ? 'emergency' : '';

        return `
          <div class="job-card ${emergencyClass}">
            <div style="margin-bottom: 8px; display: flex; justify-content: space-between; align-items: flex-start;">
              <div>
                <a href="javascript:void(0)" 
                   onclick="openPublicProfile('${posterName.replace(/'/g, "\\'")}', '${encodeURIComponent(JSON.stringify(badges))}')" 
                   style="color: #3b82f6; text-decoration: underline; font-weight: bold; font-size: 14px;">
                  Posted by ${posterName} 🔍
                </a>
                <div class="badge-container" style="margin-top: 4px; display: flex; gap: 4px;">${badgeDisplay}</div>
              </div>
              <div style="display: flex; gap: 8px; align-items: center;">
                ${j.pay ? `<span class="pay-badge">💵 ${j.pay}</span>` : ''}
                ${j.is_emergency ? '<span style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid #ef4444; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold;">🚨 EMERGENCY</span>' : ''}
              </div>
            </div>
            
            <h3 style="margin: 10px 0 6px 0; color: #fff; font-size: 18px;">${j.title}</h3>
            
            <div style="margin-bottom: 10px;">
              <span class="job-meta-tag">🏷️ ${j.work_type}</span>
              <span class="job-meta-tag">📍 Zip ${j.zip_code}</span>
              <span class="job-meta-tag">⏱️ ${j.hours_min} - ${j.hours_max} hrs</span>
              <span class="job-meta-tag">📅 Date Needed: ${j.date_needed}</span>
            </div>

            <p style="color: #ccc; font-size: 14px; line-height: 1.4; margin: 10px 0;">${j.description}</p>
            <p style="color: #aaa; font-size: 13px; margin: 6px 0 0 0;">📞 Contact Phone: <strong style="color: #fff;">${j.contact_phone}</strong></p>
            
            ${managementButtons}
          </div>
        `;
      }).join('');
    }

    function openPublicProfile(name, badgesStr) {
      const badges = JSON.parse(decodeURIComponent(badgesStr));
      document.getElementById('modal-user-name').innerText = name;
      const badgeContainer = document.getElementById('modal-badges');
      
      if (!badges.length) {
        badgeContainer.innerHTML = '<p style="color:#a1a1aa; font-size:13px;">This member has not been awarded any badges yet.</p>';
      } else {
        badgeContainer.innerHTML = badges.map(b => {
          let badgeClass = 'badge-community';
          if (b.includes('Farm')) badgeClass = 'badge-farmer';
          if (b.includes('Hand')) badgeClass = 'badge-worker';
          return `<span class="badge ${badgeClass}" style="font-size:12px; padding:4px 8px;">${b}</span>`;
        }).join('');
      }
      document.getElementById('profile-modal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').style.display = 'none';
    }

    async function markJobFilled(jobId) {
      if (!confirm("Are you sure you want to mark this job as filled? It will be removed from the public board.")) return;
      const { data, error } = await supabaseClient
        .from('jobs')
        .update({ status: 'filled' })
        .eq('id', jobId)
        .select();

      if (error) {
        alert("Error updating job: " + error.message);
      } else if (!data || data.length === 0) {
        alert("Could not update job. Ensure your Supabase RLS policy allows UPDATE for job owners.");
      } else {
        fetchJobs();
      }
    }

    async function deleteJob(jobId) {
      if (!confirm("Are you sure you want to permanently delete this job post?")) return;
      
      const { data, error } = await supabaseClient
        .from('jobs')
        .delete()
        .eq('id', jobId)
        .select();

      if (error) {
        alert("Error deleting job: " + error.message);
      } else if (!data || data.length === 0) {
        alert("Could not delete job. Please verify your Supabase 'jobs' table RLS policies.");
      } else {
        fetchJobs();
      }
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
