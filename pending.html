<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Application Pending | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="narrow-container" style="text-align: center;">
  
  <div class="panel">
    <h2 style="color: #10b981;">Application Pending</h2>
    <p>Your application to join the Rural Network is currently under review by an administrator.</p>
    <p>We verify all accounts manually to ensure a safe and reliable community for our farmers and workers. Please check back later!</p>
    <br>
    <button id="logout-btn" class="btn-logout" style="margin: 0 auto;">Log Out</button>
  </div>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
