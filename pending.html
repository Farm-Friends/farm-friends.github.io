<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Account Pending | Rural Network</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px 20px; max-width: 500px; margin: auto; }
    .card { border: 1px solid #ccc; padding: 30px; border-radius: 8px; }
    button { background: #d32f2f; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Application Under Review</h2>
    <p>Your membership is currently pending admin approval. You will receive access once a network administrator verifies your details.</p>
    <button id="logout-btn">Log Out</button>
  </div>

  <script>
    const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_ANON_KEY');

    document.getElementById('logout-btn').addEventListener('click', async () => {
      await supabase.auth.signOut();
      window.location.href = '/index.html';
    });
  </script>
</body>
</html>
