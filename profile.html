<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #333;">
    <h1>My Profile</h1>
    <nav>
      <a href="jobs.html" style="color: #3b82f6; text-decoration: none; margin-right: 15px;">&larr; Back to Job Board</a>
      <button class="btn-logout" onclick="logout()" style="padding: 6px 12px; font-size: 14px;">Log Out</button>
    </nav>
  </header>

  <main>
    <!-- BADGES & STRIKES SECTION -->
    <div class="panel" style="background: #1e1e1e; border: 1px solid #333; margin-bottom: 20px; text-align: center;">
      <h2 style="margin-top: 0; color: #fff;">Community Standing</h2>
      
      <div id="my-badges" class="badge-container" style="justify-content: center; margin: 15px 0;">
        <p style="color: #a1a1aa; font-size: 14px;">Loading badges...</p>
      </div>

      <div id="my-strikes" style="margin-top: 15px; font-weight: bold;">
        <!-- Strikes render here -->
      </div>
    </div>

    <!-- UPDATE PROFILE FORM -->
    <div class="panel">
      <h3 style="margin-top:0;">Update Details</h3>
      <form id="profile-form">
        <label style="display:block; margin-bottom:5px; color:#a1a1aa;">Full Name</label>
        <input type="text" id="prof_name" required />
        <p id="name-lock-notice" style="font-size: 12px; color: #f59e0b; margin-top: -5px; margin-bottom: 10px; display: none;">
          ⚠️ Names can only be changed once every 14 days to preserve community trust.
        </p>
        
        <label style="display:block; margin-bottom:5px; color:#a1a1aa; margin-top:10px;">Phone Number</label>
        <input type="tel" id="prof_phone" required />
        
        <label style="display:block; margin-bottom:5px; color:#a1a1aa; margin-top:10px;">Zip Code</label>
        <input type="text" id="prof_zip" required />

        <button type="submit" style="margin-top: 20px;">Save Changes</button>
      </form>
    </div>
  </main>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;
    let originalName = "";
    let lastNameChange = null;

    const TWO_WEEKS_MS = 14 * 24 * 60 * 60 * 1000;

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      currentUserId = session.user.id;
      loadProfileData();
    });

    async function loadProfileData() {
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('full_name, phone, zip_code, badges, strikes, last_name_change')
        .eq('id', currentUserId)
        .single();

      if (error) {
        alert("Error loading profile: " + error.message);
        return;
      }

      // Populate Form & Track Original Values
      originalName = profile.full_name || '';
      lastNameChange = profile.last_name_change ? new Date(profile.last_name_change).getTime() : null;

      document.getElementById('prof_name').value = originalName;
      document.getElementById('prof_phone').value = profile.phone || '';
      document.getElementById('prof_zip').value = profile.zip_code || '';

      // Check if name change is currently restricted
      if (lastNameChange) {
        const timePassed = Date.now() - lastNameChange;
        if (timePassed < TWO_WEEKS_MS) {
          const daysLeft = Math.ceil((TWO_WEEKS_MS - timePassed) / (1000 * 60 * 60 * 24));
          const notice = document.getElementById('name-lock-notice');
          notice.innerText = `🔒 You changed your name recently. Name edits locked for ${daysLeft} more day(s).`;
          notice.style.display = 'block';
        }
      }

      // Render Badges
      const badgeContainer = document.getElementById('my-badges');
      const badges = profile.badges || [];
      
      if (badges.length === 0) {
        badgeContainer.innerHTML = '<p style="color: #a1a1aa; font-size: 14px;">You have not earned any badges yet. Keep completing jobs reliably!</p>';
      } else {
        badgeContainer.innerHTML = badges.map(b => {
          let badgeClass = 'badge-community';
          if (b.includes('Farmer')) badgeClass = 'badge-farmer';
          if (b.includes('Hand')) badgeClass = 'badge-worker';
          return `<span class="badge ${badgeClass}" style="font-size: 14px; padding: 6px 12px;">${b}</span>`;
        }).join('');
      }

      // Render Strikes
      const strikesContainer = document.getElementById('my-strikes');
      const strikes = profile.strikes || 0;
      
      if (strikes === 0) {
        strikesContainer.innerHTML = '<span style="color: #10b981;">0 Strikes - Excellent Standing</span>';
      } else {
        strikesContainer.innerHTML = `<span style="color: #ef4444;">${strikes} Strike(s) on your account. 3 Strikes results in a ban.</span>`;
      }
    }

    // Handle Profile Update
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newName = document.getElementById('prof_name').value.trim();
      const newPhone = document.getElementById('prof_phone').value.trim();
      const newZip = document.getElementById('prof_zip').value.trim();

      const updates = {
        phone: newPhone,
        zip_code: newZip
      };

      // Handle Name Change Restriction Logic
      if (newName !== originalName) {
        if (lastNameChange) {
          const timePassed = Date.now() - lastNameChange;
          if (timePassed < TWO_WEEKS_MS) {
            const daysLeft = Math.ceil((TWO_WEEKS_MS - timePassed) / (1000 * 60 * 60 * 24));
            alert(`Name changes are restricted to once every 2 weeks to maintain accountability.\n\nPlease wait ${daysLeft} more day(s) before changing your name again.`);
            document.getElementById('prof_name').value = originalName;
            return;
          }
        }

        // If allowed, append name and new timestamp
        updates.full_name = newName;
        updates.last_name_change = new Date().toISOString();
      }

      const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentUserId);
      
      if (error) {
        alert("Error updating profile: " + error.message);
      } else {
        alert("Profile updated successfully!");
        loadProfileData(); // Reload to update state and lockdown timers
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
