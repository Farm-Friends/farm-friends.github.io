<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Rural Network</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid #333;
      gap: 15px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    /* Mobile Responsive Header Layout */
    @media (max-width: 768px) {
      .header-container {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        width: 100%;
        justify-content: flex-start;
        flex-wrap: wrap;
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <header class="header-container">
    <h1 style="margin: 0;">My Profile</h1>
    <nav class="nav-links">
      <a href="jobs.html" style="color: #3b82f6; text-decoration: none;">&larr; Back to Job Board</a>
      <a href="grievance.html" style="color: #ef4444; text-decoration: none; font-size: 14px;">File Grievance</a>
      <button class="btn-logout" onclick="logout()" style="padding: 6px 12px; font-size: 14px;">Log Out</button>
    </nav>
  </header>

  <main>
    <!-- BADGES & STRIKES SECTION -->
    <div class="panel" style="background: #1e1e1e; border: 1px solid #333; margin-bottom: 20px; text-align: center;">
      <h2 style="margin-top: 0; color: #fff;">Community Standing</h2>
      
      <div id="my-badges" class="badge-container" style="justify-content: center; margin: 15px 0;">
        <p style="color: #a1a1aa; font-size: 14px;">Loading badges...</p>
      </div>

      <div id="my-strikes" style="margin-top: 15px; font-weight: bold;">
        <!-- Strikes render here -->
      </div>
    </div>

    <!-- UPDATE PROFILE FORM -->
    <div class="panel" style="margin-bottom: 20px;">
      <h3 style="margin-top:0;">Update Details</h3>
      <form id="profile-form">
        <label style="display:block; margin-bottom:5px; color:#a1a1aa;">Full Name</label>
        <input type="text" id="prof_name" required />
        <p id="name-lock-notice" style="font-size: 12px; color: #f59e0b; margin-top: -5px; margin-bottom: 10px; display: none;">
          ⚠️ Names can only be changed once every 14 days to preserve community trust.
        </p>
        
        <label style="display:block; margin-bottom:5px; color:#a1a1aa; margin-top:10px;">Phone Number</label>
        <input type="tel" id="prof_phone" required />
        
        <label style="display:block; margin-bottom:5px; color:#a1a1aa; margin-top:10px;">Zip Code</label>
        <input type="text" id="prof_zip" required />

        <label for="max_distance" style="display: block; margin-bottom: 5px; color: #a1a1aa; margin-top: 10px; font-size: 14px;">Maximum Travel Distance</label>
        <select id="max_distance" style="width: 100%; padding: 10px; background: #2a2a2a; color: #fff; border: 1px solid #444; border-radius: 4px;">
          <option value="10">Within 10 miles</option>
          <option value="25">Within 25 miles</option>
          <option value="50">Within 50 miles</option>
          <option value="100">Within 100 miles</option>
          <option value="500">Any distance / Statewide</option>
        </select>

        <button type="submit" style="margin-top: 20px;">Save Changes</button>
      </form>
    </div>

    <!-- ACTIVE POSTINGS SECTION -->
    <div class="panel" style="background: #1e1e1e; border: 1px solid #333; margin-bottom: 20px;">
      <h3 style="margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 18px;">Currently Active Postings</h3>
      <div id="active-jobs-container">
        <p style="color: #a1a1aa; font-size: 13px;">Loading active job postings...</p>
      </div>
    </div>

    <!-- ARCHIVED POSTINGS SECTION (FLOATING TOP 10 FILLED) -->
    <div class="panel" style="background: #1e1e1e; border: 1px solid #333; margin-bottom: 20px;">
      <h3 style="margin-top: 0; color: #fff; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 18px;">Job History (Last 10 Filled)</h3>
      <div id="archived-jobs-container">
        <p style="color: #a1a1aa; font-size: 13px;">Loading archived jobs...</p>
      </div>
    </div>
  </main>

  <script>
    // Initialize Supabase
    const SUPABASE_URL = 'https://mokdqdrcqlfmjrpjnebo.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_f-4JIgGVXuiJueHS-IfcxQ_VQhcEZv1';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;
    let originalName = "";
    let lastNameChange = null;

    const TWO_WEEKS_MS = 14 * 24 * 60 * 60 * 1000;

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }
      currentUserId = session.user.id;
      await loadProfileData();
      await loadUserJobs();
    });

    async function loadProfileData() {
      const { data: profile, error } = await supabaseClient
        .from('profiles')
        .select('full_name, phone, zip_code, max_distance, badges, strikes, last_name_change')
        .eq('id', currentUserId)
        .single();

      if (error) {
        alert("Error loading profile: " + error.message);
        return;
      }

      // Populate Form & Track Original Values
      originalName = profile.full_name || '';
      lastNameChange = profile.last_name_change ? new Date(profile.last_name_change).getTime() : null;

      document.getElementById('prof_name').value = originalName;
      document.getElementById('prof_phone').value = profile.phone || '';
      document.getElementById('prof_zip').value = profile.zip_code || '';
      document.getElementById('max_distance').value = profile.max_distance || 25;

      // Check if name change is currently restricted
      if (lastNameChange) {
        const timePassed = Date.now() - lastNameChange;
        if (timePassed < TWO_WEEKS_MS) {
          const daysLeft = Math.ceil((TWO_WEEKS_MS - timePassed) / (1000 * 60 * 60 * 24));
          const notice = document.getElementById('name-lock-notice');
          notice.innerText = `🔒 You changed your name recently. Name edits locked for ${daysLeft} more day(s).`;
          notice.style.display = 'block';
        }
      }

      // Render Badges
      const badgeContainer = document.getElementById('my-badges');
      const badges = profile.badges || [];
      
      if (badges.length === 0) {
        badgeContainer.innerHTML = '<p style="color: #a1a1aa; font-size: 14px;">You have not earned any badges yet. Keep completing jobs reliably!</p>';
      } else {
        badgeContainer.innerHTML = badges.map(b => {
          let badgeClass = 'badge-community';
          if (b.includes('Farmer')) badgeClass = 'badge-farmer';
          if (b.includes('Hand')) badgeClass = 'badge-worker';
          return `<span class="badge ${badgeClass}" style="font-size: 14px; padding: 6px 12px;">${b}</span>`;
        }).join('');
      }

      // Render Strikes
      const strikesContainer = document.getElementById('my-strikes');
      const strikes = profile.strikes || 0;
      
      if (strikes === 0) {
        strikesContainer.innerHTML = '<span style="color: #10b981;">0 Strikes - Excellent Standing</span>';
      } else {
        strikesContainer.innerHTML = `<span style="color: #ef4444;">${strikes} Strike(s) on your account. 3 Strikes results in a ban.</span>`;
      }
    }

    // LOAD ACTIVE AND ARCHIVED JOBS FOR LOGGED-IN USER
    async function loadUserJobs() {
      // 1. Active Jobs
      const { data: activeJobs, error: activeErr } = await supabaseClient
        .from('jobs')
        .select('*')
        .eq('poster_id', currentUserId)
        .eq('status', 'active')
        .order('created_at', { ascending: false });

      const activeContainer = document.getElementById('active-jobs-container');
      if (activeErr) {
        activeContainer.innerHTML = '<p style="color: #ef4444; font-size: 13px;">Error loading active postings.</p>';
      } else if (!activeJobs || !activeJobs.length) {
        activeContainer.innerHTML = '<p style="color: #a1a1aa; font-size: 13px;">You have no active job postings.</p>';
      } else {
        activeContainer.innerHTML = activeJobs.map(job => `
          <div style="background: #2a2a2a; padding: 12px 16px; border-radius: 6px; margin-bottom: 10px; border: 1px solid #333; display: flex; justify-content: space-between; align-items: center;">
            <div>
              <strong style="color: #fff; font-size: 15px;">${job.title}</strong>
              <div style="color: #a1a1aa; font-size: 12px; margin-top: 3px;">📍 ${job.zip_code || 'N/A'} | Posted ${new Date(job.created_at).toLocaleDateString()}</div>
            </div>
            <div style="display: flex; gap: 8px;">
              <button onclick="markJobFilled('${job.id}')" style="background: #10b981; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">Mark as Filled</button>
              <button onclick="deleteJob('${job.id}')" style="background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold;">Delete</button>
            </div>
          </div>
        `).join('');
      }

      // 2. Archived / Filled Jobs (Floating capped at 10 - Excludes Description, Emergency Tag, and Contact Phone)
      const { data: filledJobs, error: filledErr } = await supabaseClient
        .from('jobs')
        .select('*')
        .eq('poster_id', currentUserId)
        .eq('status', 'filled')
        .order('created_at', { ascending: false })
        .limit(10);

      const archivedContainer = document.getElementById('archived-jobs-container');
      if (filledErr) {
        archivedContainer.innerHTML = '<p style="color: #ef4444; font-size: 13px;">Error loading archive history.</p>';
      } else if (!filledJobs || !filledJobs.length) {
        archivedContainer.innerHTML = '<p style="color: #a1a1aa; font-size: 13px;">No past filled jobs in your archive.</p>';
      } else {
        archivedContainer.innerHTML = filledJobs.map(job => `
          <div style="background: #18181b; padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #27272a; opacity: 0.9;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px;">
              <div>
                <strong style="color: #fff; font-size: 16px;">${job.title}</strong>
              </div>
              <div style="display: flex; gap: 8px; align-items: center;">
                ${job.pay ? `<span style="background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; padding: 3px 10px; border-radius: 12px; font-weight: bold; font-size: 12px;">💵 ${job.pay}</span>` : ''}
                <span style="background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid #10b981; border-radius: 12px; padding: 3px 8px; font-size: 11px; font-weight: bold;">Archived</span>
              </div>
            </div>

            <div style="display: flex; flex-wrap: wrap; gap: 6px;">
              <span style="background: #2a2a2a; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #a1a1aa;">🏷️ ${job.work_type || 'General'}</span>
              <span style="background: #2a2a2a; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #a1a1aa;">📍 Zip ${job.zip_code || 'N/A'}</span>
              <span style="background: #2a2a2a; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #a1a1aa;">⏱️ ${job.hours_min || 0} - ${job.hours_max || 0} hrs</span>
              <span style="background: #2a2a2a; padding: 3px 8px; border-radius: 4px; font-size: 12px; color: #a1a1aa;">📅 Date Needed: ${job.date_needed || 'N/A'}</span>
            </div>
          </div>
        `).join('');
      }
    }

    // MARK JOB AS FILLED (MOVES TO ARCHIVE)
    async function markJobFilled(jobId) {
      const { error } = await supabaseClient
        .from('jobs')
        .update({ status: 'filled' })
        .eq('id', jobId);

      if (error) {
        alert('Error marking job as filled: ' + error.message);
      } else {
        await loadUserJobs();
      }
    }

    // DELETE JOB PERMANENTLY (DOES NOT GO TO ARCHIVE)
    async function deleteJob(jobId) {
      if (!confirm('Are you sure you want to permanently delete this posting? It will not be archived.')) return;

      const { error } = await supabaseClient
        .from('jobs')
        .delete()
        .eq('id', jobId);

      if (error) {
        alert('Error deleting job: ' + error.message);
      } else {
        await loadUserJobs();
      }
    }

    // Handle Profile Update
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const newName = document.getElementById('prof_name').value.trim();
      const newPhone = document.getElementById('prof_phone').value.trim();
      const newZip = document.getElementById('prof_zip').value.trim();
      const maxDistance = parseInt(document.getElementById('max_distance').value, 10);

      const updates = {
        phone: newPhone,
        zip_code: newZip,
        max_distance: maxDistance
      };

      // Handle Name Change Restriction Logic
      if (newName !== originalName) {
        if (lastNameChange) {
          const timePassed = Date.now() - lastNameChange;
          if (timePassed < TWO_WEEKS_MS) {
            const daysLeft = Math.ceil((TWO_WEEKS_MS - timePassed) / (1000 * 60 * 60 * 24));
            alert(`Name changes are restricted to once every 2 weeks to maintain accountability.\n\nPlease wait ${daysLeft} more day(s) before changing your name again.`);
            document.getElementById('prof_name').value = originalName;
            return;
          }
        }

        // If allowed, append name and new timestamp
        updates.full_name = newName;
        updates.last_name_change = new Date().toISOString();
      }

      const { error } = await supabaseClient.from('profiles').update(updates).eq('id', currentUserId);
      
      if (error) {
        alert("Error updating profile: " + error.message);
      } else {
        alert("Profile updated successfully!");
        loadProfileData(); // Reload to update state and lockdown timers
      }
    });

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
